# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- resources:
    cpu: true
    memory: true
    disk: /

- search:
    provider: google
    target: _blank

- news:
    api: newsapi
    apiKey: {{HOMEPAGE_VAR_NEWSAPI_KEY}} # Use placeholder
    query: "Politics OR Government OR Economy"
    limit: 5
    style: ticker

