services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.1.1
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - ./config:/app/config
      - ./public/icons:/app/public/icons


    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_VAR_NEWSAPI_KEY=e1c7d1000c9f419d8970a2d306fbd85f

    restart: unless-stopped